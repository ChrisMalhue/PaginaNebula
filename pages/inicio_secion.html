<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header id ="header"></header>

    <section id="cotizacion" class="section">
        <div class="container is-max-desktop" style="max-width: 500px;"> <!-- Esto lo hace angost para que se vea mas clean -->
            
            <h2 class="title is-4 has-text-centered mb-2">Inicio sesion</h2>

            <form class="box cotizacion-form-mini" onsubmit="recibirDatosLogin(event)">
                
                <!-- Campo 1: Usuario -->
                <div class="field mb-4">
                    <label class="label">Nombre de usuario</label>
                    <div class="control">
                        <input class="input" id="usuario" type="text" placeholder="Ingresa tu nombre de usuario" required>
                    </div>
                </div>

                <!-- Campo 2: Contra -->
                <div class="field mb-4">
                    <label class="label">Contraseña</label>
                    <div class="control">
                        <input class="input" id="contrasena" type="tel" placeholder="Contraseña" required>
                    </div>
                </div>

                <!-- Botón -->
                <button type="submit" class="button is-link is-fullwidth btn-iniciar-sesion">
                    Iniciar sesion
                </button>

            </form>
        </div>
    </section>

    <footer id="footer-container"></footer>
</body>
<script src="../scripts/script.js"></script>
</html>
